<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProudVocab Android</title>
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="android-mobile.css">
</head>
<body class="booting">

  <header id="topbar">
    <div class="brand">
      <img src="ext/icons/icon48.png" alt="" class="brand-icon" onerror="this.style.display='none'">
      <span class="brand-name">ProudVocab<span class="brand-tag">Android</span></span>
    </div>

    <div class="now-playing" id="now-playing" title="">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="m10 9.5 4.5 2.5L10 14.5z" fill="currentColor" stroke="none"/></svg>
      <span id="now-playing-text">No video loaded</span>
    </div>

    <div class="topbar-spacer"></div>

    <span id="panel-status" class="panel-status" title="Vocabulary panel connection">panel</span>

    <button id="btn-panel" class="tb-btn active" title="Show / hide the vocabulary panel  (Ctrl+B)">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M15 4v16"/></svg>
      <span>Panel</span>
    </button>
    <button id="btn-fullscreen" class="tb-btn" title="Full screen  (F11)">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
    </button>
  </header>

  <main id="app">
    <section id="stage"></section>
    <div id="splitter" title="Drag to resize the panel"></div>
    <aside id="panel-wrap"></aside>
  </main>

  <div id="boot"><div class="spin"></div><div>Starting ProudVocab…</div></div>
  <script src="android-bridge.js"></script>
  <script src="shell.js"></script>
</body>
</html>
