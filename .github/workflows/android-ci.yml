name: Android CI

on:
  push:
    branches:
      - main
      - arena/d52e3fb8-proudvocab-android
  pull_request:
    branches:
      - main
      - arena/d52e3fb8-proudvocab-android
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Test and build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 SDK packages
        run: sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Run JavaScript/parser tests
        run: node --test test/*.test.mjs

      - name: Check JavaScript syntax
        run: |
          find app/src/main/assets/www -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Build and lint Android app
        shell: bash
        run: |
          set +e
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace --console=plain clean testDebugUnitTest lint assembleDebug assembleRelease \
            -PversionCode="${GITHUB_RUN_NUMBER}" -PversionName="0.1.0" 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
          RESULT=${PIPESTATUS[0]}
          if [[ "$RESULT" -ne 0 ]]; then
            echo '### Gradle failure details' >> "$GITHUB_STEP_SUMMARY"
            grep -E '^(e: |FAILURE:|\* What went wrong:|Execution failed for task|.*Could not resolve|.*error:)' "$RUNNER_TEMP/gradle-build.log" \
              | tail -n 40 | tee -a "$GITHUB_STEP_SUMMARY" \
              | while IFS= read -r line; do echo "::error title=Gradle build detail::$line"; done
          fi
          exit "$RESULT"

      - name: Verify APK packages
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK=app/build/outputs/apk/debug/app-debug.apk
          RELEASE_APK=app/build/outputs/apk/release/app-release.apk
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          unzip -t "$DEBUG_APK" >/dev/null
          unzip -t "$RELEASE_APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$RELEASE_APK" | grep -F "package: name='app.proudvocab.android'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$RELEASE_APK" | grep -F "sdkVersion:'28'"

      - name: Upload installable APKs and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proudvocab-android-ci-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/reports/lint-results-*.html
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/tests/testDebugUnitTest/**
